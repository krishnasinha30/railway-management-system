name: Railway Management System CI/CD & DevOps Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Code Quality & Build Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            client/package-lock.json
            server/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./client
        run: npm ci

      - name: Build frontend
        working-directory: ./client
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://railway-management-system-p9dz.onrender.com/api' }}
          VITE_SOCKET_URL: ${{ secrets.VITE_SOCKET_URL || 'https://railway-management-system-p9dz.onrender.com' }}
        run: npm run build

      - name: Install backend dependencies
        working-directory: ./server
        run: npm ci

      - name: Validate backend syntax
        working-directory: ./server
        shell: bash
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check

  docker-build:
    name: Docker Container Build & Integration Test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Server Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: false
          tags: railway-management-server:test

      - name: Build Client Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: false
          tags: railway-management-client:test

      - name: Test Docker Compose Stack Startup
        run: |
          docker compose up -d --build
          sleep 10
          docker compose ps
          curl -f http://localhost:5000/api/health || exit 1
          docker compose down

  deploy:
    name: Automated Deploy Trigger (Render & Netlify)
    needs: docker-build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deployment
        if: ${{ secrets.RENDER_DEPLOY_HOOK != '' }}
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"

      - name: Trigger Netlify Deployment
        if: ${{ secrets.NETLIFY_BUILD_HOOK != '' }}
        run: curl -X POST "${{ secrets.NETLIFY_BUILD_HOOK }}"
