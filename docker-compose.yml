services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  server:
    build: ./server
    restart: unless-stopped
    env_file:
      - ./server/.env
    environment:
      PORT: 5000
      MONGO_URI: ${MONGO_URI:-mongodb+srv://krishnasinha19701_db_user:kEWK3wgbgnWvOflD@cluster0.k5kdbdq.mongodb.net/railway_management?retryWrites=true&w=majority}
      JWT_SECRET: 8f41e57c6b901a3d827f4e90c5b2a3d1e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
