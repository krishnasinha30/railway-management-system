services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
  server:
    build: ./server
    restart: unless-stopped
    environment:
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/railway_management
      JWT_SECRET: compose-development-secret
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      NODE_ENV: development
    depends_on:
      - mongo
    ports:
      - "5000:5000"
  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"
volumes:
  mongo-data:
